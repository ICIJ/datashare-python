[project]
name = "caul-core"
version = "0.6.6"
description = "core objects for caul ASR"
authors = [
    {name = "Lion Summerbell", email = "lsummerbell@icij.org"}
]
readme = "README.md"
requires-python = ">=3.12.0, <3.14.0"
dependencies = [
    "icij-common~=0.8.1",
    "overrides~=7.7.0",
    "pydantic-extra-types[pycountry]~=2.11",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["caul_core"]

