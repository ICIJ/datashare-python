repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]
  - repo: local
    hooks:
      - id: lock-dist
        name: Rebuild uv dist lock for changed workers
        entry: scripts/lock-dist-precommit.sh
        language: system
        files: ^(worker-template|workers/[^/]+)/pyproject\.toml$
        pass_filenames: true