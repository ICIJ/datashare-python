name: Test extract-worker

on:
  push:
    branches: [ 'main' ]
    paths:
      - 'datashare-python/**'
      - 'workers/extract-worker/**'
  pull_request:
    paths:
      - 'datashare-python/**'
      - 'workers/extract-worker/**'

env:
  PYTHON_VERSION: 3.13
  ASTRAL_VERSION: 0.11.24

# TODO: leverage some caching here
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.ASTRAL_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          working-directory: workers/extract-worker
      - name: Check formatting
        run: cd workers/extract-worker && uv run --with ruff ruff check --fix .
      - name: Lint test
        run: cd workers/extract-worker && uv run --with ruff ruff format

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python project
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache Docker images
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}-${{ hashFiles('docker-compose.yml')  }}
      - name: Start test services
        run: docker compose up -d temporal-post-init elasticsearch
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.ASTRAL_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          working-directory: workers/extract-worker
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libavcodec-dev libavformat-dev libavutil-dev
      - name: Run tests
        run: |
          cd workers/extract-worker
          uv sync --verbose --frozen --extra base --extra cpu --dev
          uv run --frozen python -m pytest --timeout=180 -vvv --cache-clear --show-capture=all -r A

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
