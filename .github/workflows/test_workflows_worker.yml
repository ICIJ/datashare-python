name: Test workflows-worker

on:
  push:
    branches: [ 'main' ]
    paths:
      - 'workers/workflows-worker/**'
  pull_request:
    paths:
      - 'workers/workflows-worker/**'

env:
  PYTHON_VERSION: 3.13
  ASTRAL_VERSION: 0.11.6

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.ASTRAL_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          working-directory: workers/workflows-worker
      - name: Check formatting
        run: cd workers/workflows-worker && uv run --with ruff ruff check --fix .
      - name: Lint test
        run: cd workers/workflows-worker && uv run --with ruff ruff format

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
