name: Test worker-template

on:
  push:
    branches: [ 'main' ]
    paths:
      - 'datashare-python/**'
      - 'worker-template/**'
  pull_request:
    paths:
      - 'datashare-python/**'
      - 'worker-template/**'

env:
  PYTHON_VERSION: 3.12
  ASTRAL_VERSION: 0.11.6

# TODO: leverage some caching here
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.ASTRAL_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          working-directory: worker-template
      - name: Check formatting
        run: cd worker-template && uv run --with ruff ruff check --fix .
      - name: Lint test
        run: cd worker-template && uv run --with ruff ruff format

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python project
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache Docker images
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}-${{ hashFiles('docker-compose.yml')  }}
      - name: Start test services
        run: docker compose up -d datashare temporal-post-init elasticsearch
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.ASTRAL_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          working-directory: worker-template
      - name: Run tests
        run: |
          cd worker-template
          uv sync --frozen --all-extras --dev
          uv run --frozen python -m pytest --timeout=180 -vvv --cache-clear --show-capture=all -r A

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
